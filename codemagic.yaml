# Codemagic builds (codemagic.io). Start a build from the Codemagic app page.
#
# One-time setup: on the app's "Environment variables" tab, add these four
# variables to a group called "appstore" (tick "Secret" for each). It is the
# same group LocalLedger uses, so an existing group can be reused as it is:
#   APP_STORE_CONNECT_ISSUER_ID       Issuer ID from App Store Connect
#   APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID of the API key (Admin role)
#   APP_STORE_CONNECT_PRIVATE_KEY     full text of the AuthKey_XXXX.p8 file
#   CERTIFICATE_PRIVATE_KEY           an RSA key used for the signing certificate:
#                                     ssh-keygen -t rsa -b 2048 -m PEM -f cert_key -q -N ""
# The build then creates the signing certificate and profile itself.
#
# Both workflows start with the same three steps (shared through the anchors
# below): the no-network guard, the must-pass Core tests, and the extraction
# fixtures, which only report because they are heuristic.

definitions:
  scripts:
    - &no_network
      name: No network code
      script: |
        status=0
        grep -rnE 'URLSession|NSURLConnection|URLRequest|NWConnection|NWPathMonitor|import Network|import WebKit|WKWebView|SFSafariViewController|import SafariServices|CFStream|import StoreKit|import CloudKit|Firebase|https?://' ReceiptVault --include='*.swift' || status=$?
        if [ "$status" -eq 0 ]; then
          echo "Network code or a URL was found (lines above). ReceiptVault must contain no networking code."
          exit 1
        elif [ "$status" -ne 1 ]; then
          echo "The network check could not search ReceiptVault/ (grep exit $status)."
          exit 1
        fi
        resolved=$(find . -name Package.resolved -not -path './.build/*')
        if [ -n "$resolved" ]; then
          echo "A Package.resolved file was found, so a Swift package dependency was added:"
          echo "$resolved"
          exit 1
        fi
        echo "No network code and no package dependencies."
    - &core_tests
      name: Core tests (must pass)
      script: |
        swift test --filter 'ReceiptCoreTests\.(DatesMoneyTests|RulesTests|BackupExportTests)'
    - &extraction_tests
      name: Extraction tests (report only)
      script: |
        swift test --filter 'ReceiptCoreTests\.ExtractionTests' || echo 'WARNING: extraction heuristics need tuning'

workflows:
  testflight:
    name: TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.chager5000.receiptvault
    scripts:
      - *no_network
      - *core_tests
      - *extraction_tests
      - name: Build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" ReceiptVault.xcodeproj/project.pbxproj
      - name: Signing certificate and profile
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed app
        script: xcode-project build-ipa --project ReceiptVault.xcodeproj --scheme ReceiptVault
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  check:
    name: Tests and unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 25
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.chager5000.receiptvault
    scripts:
      - *no_network
      - *core_tests
      - *extraction_tests
      - name: Build (unsigned)
        script: |
          set -o pipefail
          xcodebuild build -project ReceiptVault.xcodeproj -scheme ReceiptVault -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
      - name: Linked frameworks (report only)
        script: |
          app_binary="build/Build/Products/Release-iphoneos/ReceiptVault.app/ReceiptVault"
          if [ -f "$app_binary" ]; then
            echo "Frameworks and libraries linked by ReceiptVault:"
            otool -L "$app_binary" || echo "WARNING: otool could not read the app binary."
            if otool -L "$app_binary" 2>/dev/null | grep -E '/(Network|CFNetwork|WebKit|SafariServices|StoreKit|CloudKit)\.framework/'; then
              echo "WARNING: a network-related framework is linked (lines above). Check which import pulls it in."
            fi
          else
            echo "WARNING: $app_binary was not found, so the linked-framework report was skipped."
          fi
          exit 0
